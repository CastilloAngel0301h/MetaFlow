<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetaFlow - DBS Neon</title>
    
    <link rel="manifest" id="manifest-placeholder">
    <meta name="theme-color" content="#050508">
    <meta name="mobile-web-app-capable" content="yes">
    
    <style>
        :root {
            --bg-dark: #050508;
            --panel-bg: rgba(10, 12, 22, 0.85);
            --neon-cyan: #00f3ff;
            --neon-magenta: #d946ef;
            --neon-green: #39ff14;
            --neon-yellow: #ffea00;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        /* 1. VENTANA DE BLOQUEO / LOGIN DB SUPER */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(5, 5, 12, 0.95)), 
                        url('https://images.alphacoders.com/978/978931.jpg') no-repeat center center / cover;
            z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease-out; overflow: hidden;
        }

        .hero-dragon-img {
            width: 220px; max-width: 70%; cursor: pointer; margin-bottom: 20px; z-index: 4;
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.9));
            animation: floatHero 3s ease-in-out infinite alternate;
        }

        @keyframes floatHero {
            0% { transform: translateY(0) scale(0.98); filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.8)); }
            100% { transform: translateY(-15px) scale(1.05); filter: drop-shadow(0 0 35px rgba(217, 70, 239, 0.9)); }
        }

        .login-box {
            background: rgba(8, 10, 20, 0.85); border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); padding: 25px; border-radius: 16px;
            z-index: 5; text-align: center; width: 90%; max-width: 360px; backdrop-filter: blur(12px);
        }
        
        .login-box h1 { 
            color: var(--neon-cyan); font-size: 2.2rem; letter-spacing: 3px; 
            text-shadow: 0 0 15px var(--neon-cyan); margin-bottom: 5px;
            font-weight: 900; font-style: italic;
        }
        
        .login-input {
            width: 100%; padding: 15px; margin: 20px 0; background: #050508; border: 2px solid var(--neon-magenta);
            color: var(--neon-cyan); border-radius: 8px; font-size: 1.5rem; text-align: center; 
            outline: none; box-shadow: inset 0 0 10px rgba(217, 70, 239, 0.4); font-weight: bold;
        }

        /* 2. APP PRINCIPAL DB SUPER NEON */
        #app-wrapper {
            min-height: 100vh; display: none;
            background: linear-gradient(rgba(5, 5, 8, 0.90), rgba(5, 5, 8, 0.95)), 
                        url('https://images4.alphacoders.com/937/937829.jpg') no-repeat center center fixed / cover;
        }

        .header-banner {
            width: 100%; background: rgba(10, 12, 22, 0.95);
            border-bottom: 2px solid var(--neon-magenta); box-shadow: 0 0 25px rgba(217, 70, 239, 0.3);
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .title-main { font-size: 1.5rem; font-weight: 900; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 3px; font-style: italic; text-shadow: 0 0 10px var(--neon-cyan);}

        #app-main { padding: 15px; max-width: 1000px; margin: 0 auto; }

        .top-actions { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .paros-input-box { flex: 1; background: var(--panel-bg); border: 1px solid var(--neon-cyan); border-radius: 8px; padding: 12px; box-shadow: 0 0 10px rgba(0, 243, 255, 0.1); }
        .paros-input-box label { font-size: 0.75rem; color: var(--neon-cyan); text-transform: uppercase; display: block; margin-bottom: 5px; font-weight: bold;}
        .paros-input-box input { width: 100%; background: transparent; border: none; color: var(--neon-magenta); font-size: 1.3rem; font-weight: bold; outline: none; }

        .btn-neon {
            background: transparent; border: 2px solid var(--neon-magenta); color: #fff;
            padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(217, 70, 239, 0.4);
            transition: 0.3s;
        }
        .btn-neon:active { background: var(--neon-magenta); color: #000; box-shadow: 0 0 25px var(--neon-magenta); }

        .carga-card {
            background: var(--panel-bg); border: 1px solid #1f2438; border-left: 4px solid var(--neon-cyan); 
            border-radius: 10px; padding: 15px; margin-bottom: 15px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; position: relative;
            backdrop-filter: blur(5px); transition: 0.3s;
        }
        .carga-card:hover { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        
        .carga-title { color: var(--neon-magenta); font-weight: 900; font-size: 1rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px;}
        .btn-remove { position: absolute; right: 15px; top: 15px; background: transparent; border: none; color: #ff0055; cursor: pointer; font-weight: bold; font-size: 0.9rem;}

        .input-group label { display: block; font-size: 0.7rem; color: #aaa; margin-bottom: 4px; text-transform: uppercase; font-weight: bold;}
        .input-group input {
            width: 100%; padding: 10px; background: #050508; border: 1px solid #2d3248; color: #fff; 
            border-radius: 6px; font-size: 1rem; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 243, 255, 0.3); }
        .input-group input.docenas-input { color: var(--neon-green); font-weight: bold; font-size: 1.1rem; border-color: rgba(57, 255, 20, 0.4); }

        /* BANNER ORIGINAL: ON / OFF / DOCENAS ON / DOCENAS OFF */
        .banner-eficiencia {
            background: linear-gradient(135deg, rgba(10, 12, 22, 0.95), rgba(20, 10, 30, 0.95));
            border: 2px solid var(--neon-cyan);
            border-radius: 16px; padding: 20px; margin: 25px 0; text-align: center;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3); color: #fff;
        }
        .efi-title { font-size: 0.85rem; letter-spacing: 3px; font-weight: bold; color: var(--neon-magenta); text-transform: uppercase; }
        .efi-percent { font-size: 3.5rem; font-weight: 900; margin: 10px 0; color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); font-style: italic;}

        .stats-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; 
            margin-top: 15px; border-top: 1px solid rgba(0, 243, 255, 0.2); padding-top: 15px; 
        }
        .stat-item { text-align: center; }
        .stat-item .lbl { font-size: 0.7rem; color: #aaa; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;}
        .stat-item .val { font-size: 1.2rem; font-weight: 900; margin-top: 5px; }
        .stat-item .val.on-color { color: var(--neon-green); text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }
        .stat-item .val.off-color { color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }

        /* LÓGICA DE BITÁCORA FIEL A LA IMAGEN (PERO CON ESTILO NEÓN) */
        .bitacora-container { 
            background: rgba(5, 5, 10, 0.8); border-radius: 12px; 
            border: 1px solid var(--neon-magenta); padding: 15px; margin-top: 20px;
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.15);
        }
        .bitacora-title {
            color: var(--neon-cyan); font-weight: 900; font-style: italic; letter-spacing: 2px;
            margin-bottom: 15px; font-size: 1.1rem; text-align: center;
        }
        .carga-row {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 15px;
            background: rgba(20, 25, 40, 0.9); border-radius: 6px; margin-bottom: 5px; 
            font-size: 0.9rem; font-weight: bold; border-left: 3px solid var(--neon-cyan);
        }
        .carga-row .name { color: #fff; text-transform: uppercase; letter-spacing: 1px;}
        .carga-row .time { color: var(--neon-green); letter-spacing: 1px; }
        .carga-row .dur { color: #aaa; font-size: 0.8rem; margin-left: 8px; font-weight: normal; }

        .paro-row {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 15px 8px 30px;
            background: rgba(40, 30, 5, 0.8); border-left: 3px solid var(--neon-yellow);
            border-radius: 4px; margin-bottom: 8px; font-size: 0.8rem; color: var(--neon-yellow);
        }
        .paro-row .time-tag { font-weight: bold; letter-spacing: 1px;}

        .summary-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .summary-card { 
            background: rgba(10, 12, 22, 0.9); border: 1px solid rgba(255,255,255,0.1); 
            padding: 15px; border-radius: 8px; text-align: center; 
        }
        .summary-card .lbl { font-size: 0.75rem; color: var(--neon-cyan); font-weight: bold; text-transform: uppercase; letter-spacing: 1px;}
        .summary-card .val { font-size: 1.3rem; font-weight: 900; color: #fff; margin-top: 5px; }

        .btn-guardar {
            width: 100%; background: var(--neon-magenta); border: none; color: #000;
            padding: 18px; border-radius: 10px; font-weight: 900; font-size: 1.1rem; margin-top: 25px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 3px; font-style: italic;
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.5); transition: 0.3s;
        }
        .btn-guardar:active { transform: scale(0.98); background: var(--neon-cyan); box-shadow: 0 0 25px var(--neon-cyan); }
    </style>
</head>
<body>

    <audio id="audio-ui" src="https://ia800908.us.archive.org/21/items/tv-size-dan-dan-kokoro-hikareteku-instrumental/TV-Size%20DAN%20DAN%20Kokoro%20Hikareteku%20%28Instrumental%29.mp3" preload="auto" loop></audio>

    <!-- 1. LOGIN DBS -->
    <div id="splash-screen">
        <img class="hero-dragon-img" src="https://media.giphy.com/media/19JSJ5ucu91R5D7a3w/giphy.gif" alt="Goku Ultra Instinct" onclick="toggleMusica()">

        <div class="login-box">
            <h1>METAFLOW</h1>
            <p style="color: var(--neon-magenta); font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold;">SISTEMA DE EFICIENCIA DBS</p>
            <input type="password" id="pin" class="login-input" placeholder="PIN DE ACCESO" maxlength="6" inputmode="numeric" onfocus="playBeep()">
            <button class="btn-neon" style="width: 100%;" onclick="verificarAcceso()">INICIAR SISTEMA</button>
            <p id="error-msg" style="color: #ff0055; margin-top: 15px; font-size: 0.9rem; font-weight: bold; display: none; text-shadow: 0 0 5px #ff0055;"></p>
        </div>
    </div>

    <!-- 2. APP PRINCIPAL -->
    <div id="app-wrapper">
        <div class="header-banner">
            <div>
                <div class="title-main">METAFLOW</div>
                <div style="font-size: 0.7rem; color: #aaa; font-weight: bold; letter-spacing: 1px;" id="nombre-usuario">OPERADOR: CÁLCULO</div>
            </div>
            <button class="btn-neon" style="padding: 6px 12px; font-size: 0.75rem;">SYNC</button>
        </div>

        <div id="app-main">
            <div class="top-actions">
                <div class="paros-input-box">
                    <label>PAROS EXTERNOS (MINS)</label>
                    <input type="number" id="paros-mins" value="0" min="0" oninput="playBeep(); calcularTodo();">
                </div>
                <button class="btn-neon" onclick="playPowerUp(); agregarCarga();">+ AÑADIR CARGA</button>
            </div>

            <div id="contenedor-cargas"></div>

            <!-- BANNER ORIGINAL QUE PEDISTE MANTENER -->
            <div class="banner-eficiencia">
                <div class="efi-title">EFICIENCIA GLOBAL</div>
                <div class="efi-percent" id="efi-final">0.00%</div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="lbl">EFI ON</div><div class="val on-color" id="val-efi-on">0.00%</div></div>
                    <div class="stat-item"><div class="lbl">EFI OFF</div><div class="val off-color" id="val-efi-off">0.00%</div></div>
                    <div class="stat-item"><div class="lbl">DOC. ON</div><div class="val on-color" id="val-doc-on">0.0</div></div>
                    <div class="stat-item"><div class="lbl">DOC. OFF</div><div class="val off-color" id="val-doc-off">0.0</div></div>
                </div>
            </div>

            <!-- BITÁCORA CON LA LÓGICA DE LA IMAGEN (TIEMPOS CONTINUOS Y RECESOS) -->
            <div class="bitacora-container">
                <div class="bitacora-title">CUADRE DE PRODUCCIÓN - 12 HORAS</div>
                <div id="bitacora-list"></div>
            </div>

            <div class="summary-footer">
                <div class="summary-card">
                    <div class="lbl">TIEMPO PRODUCCIÓN PURO</div>
                    <div class="val">11H 00M</div>
                </div>
                <div class="summary-card" style="border-color: var(--neon-yellow);">
                    <div class="lbl" style="color: var(--neon-yellow);">RECESOS OBLIGATORIOS</div>
                    <div class="val" style="color: var(--neon-yellow);">1H 00M</div>
                </div>
            </div>

            <button class="btn-guardar" onclick="playPowerUp()">GUARDAR BITÁCORA</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playPowerUp() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function toggleMusica() {
            const cancion = document.getElementById('audio-ui');
            playBeep();
            if (cancion.paused) { cancion.play().catch(() => {}); } 
            else { cancion.pause(); }
        }

        let cargas = [
            { estilo: '1717.0', talla: 'M', metaPzaHr: 700.0, hechas: 126 },
            { estilo: '9018.0', talla: 'S', metaPzaHr: 550.0, hechas: 220 }
        ];

        // LÓGICA DE TIEMPOS DE LA IMAGEN
        const RECESOS_FIJOS = [
            { id: 1, nombre: 'PARO FIJO: RECESO', inicioMin: 70, finMin: 85, duracion: 15, tag: '08:10 AM - 08:25 AM (15 min)' },
            { id: 2, nombre: 'PARO FIJO: ALMUERZO', inicioMin: 260, finMin: 290, duracion: 30, tag: '11:20 AM - 11:50 AM (30 min)' },
            { id: 3, nombre: 'PARO FIJO: RECESO', inicioMin: 490, finMin: 505, duracion: 15, tag: '03:10 PM - 03:25 PM (15 min)' }
        ];

        const usuariosAutorizados = [
            { pin: "2004", nombre: "Ángel Castillo" },
            { pin: "1234", nombre: "Karina Cabrera" }
        ];

        function verificarAcceso() {
            const pin = document.getElementById('pin').value;
            const user = usuariosAutorizados.find(u => u.pin === pin);

            if (user) {
                playPowerUp();
                document.getElementById('nombre-usuario').innerText = "OPERADOR: " + user.nombre.toUpperCase();
                
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('app-wrapper').style.display = 'block';
                    renderizarCargas();
                }, 600);
            } else {
                playBeep();
                document.getElementById('error-msg').innerText = "PIN INCORRECTO";
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function agregarCarga() {
            cargas.push({ estilo: 'NUEVO', talla: 'M', metaPzaHr: 500.0, hechas: 0 });
            renderizarCargas();
        }

        function eliminarCarga(index) {
            if (cargas.length > 1) {
                playBeep();
                cargas.splice(index, 1);
                renderizarCargas();
            }
        }

        function actualizarCarga(index, campo, valor) {
            cargas[index][campo] = (campo === 'hechas' || campo === 'metaPzaHr') ? (parseFloat(valor) || 0) : valor;
            calcularTodo();
        }

        function renderizarCargas() {
            const container = document.getElementById('contenedor-cargas');
            container.innerHTML = '';

            cargas.forEach((c, i) => {
                container.innerHTML += `
                    <div class="carga-card">
                        <div class="carga-title">CARGA #${i + 1}</div>
                        <button class="btn-remove" onclick="eliminarCarga(${i})">QUITAR</button>
                        
                        <div class="input-group">
                            <label>ESTILO</label>
                            <input type="text" value="${c.estilo}" onchange="actualizarCarga(${i}, 'estilo', this.value)">
                        </div>
                        <div class="input-group">
                            <label>TALLA</label>
                            <input type="text" value="${c.talla}" onchange="actualizarCarga(${i}, 'talla', this.value)">
                        </div>
                        <div class="input-group">
                            <label>META (PZA/H)</label>
                            <input type="number" value="${c.metaPzaHr}" oninput="actualizarCarga(${i}, 'metaPzaHr', this.value)">
                        </div>
                        <div class="input-group">
                            <label>DOCENAS HECHAS</label>
                            <input type="number" class="docenas-input" value="${c.hechas}" oninput="actualizarCarga(${i}, 'hechas', this.value)">
                        </div>
                    </div>
                `;
            });
            calcularTodo();
        }

        function formatoHora(minutosDesde7AM) {
            let totalMins = 7 * 60 + minutosDesde7AM;
            let h = Math.floor(totalMins / 60);
            let m = Math.round(totalMins % 60);
            if (m >= 60) { h += 1; m = 0; }
            let ampm = h >= 12 ? 'PM' : 'AM';
            let displayH = h > 12 ? h - 12 : h;
            if (displayH === 0) displayH = 12;
            return `${displayH.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${ampm}`;
        }

        function formatoDuracion(minutos) {
            let h = Math.floor(minutos / 60);
            let m = Math.round(minutos % 60);
            if (h > 0) return `(${h}H ${m.toString().padStart(2, '0')}M)`;
            return `(${m}M)`;
        }

        function calcularTodo() {
            let totalDocenas = cargas.reduce((acc, c) => acc + c.hechas, 0);
            let metaPromedioPzaHr = cargas.reduce((acc, c) => acc + c.metaPzaHr, 0) / (cargas.length || 1);
            let metaDiaDocenas = (metaPromedioPzaHr * 11) / 12; 

            let parosMins = parseFloat(document.getElementById('paros-mins').value) || 0;
            let horasOn = 11 - (parosMins / 60);
            let metaOn = (metaPromedioPzaHr * horasOn) / 12;

            let efiOff = metaDiaDocenas > 0 ? (totalDocenas / metaDiaDocenas) * 100 : 0;
            let efiOn = metaOn > 0 ? (totalDocenas / metaOn) * 100 : 0;

            document.getElementById('efi-final').innerText = efiOff.toFixed(2) + '%';
            document.getElementById('val-efi-on').innerText = efiOn.toFixed(2) + '%';
            document.getElementById('val-efi-off').innerText = efiOff.toFixed(2) + '%';
            document.getElementById('val-doc-on').innerText = totalDocenas.toFixed(1);
            document.getElementById('val-doc-off').innerText = metaDiaDocenas.toFixed(1);

            // MANTENEMOS LA LÓGICA DE TIEMPOS DE TU IMAGEN
            generarBitacora(totalDocenas);
        }

        function generarBitacora(totalDocenas) {
            const container = document.getElementById('bitacora-list');
            container.innerHTML = '';

            if (cargas.length === 0) return;

            let minutosTrabajoPuro = cargas.map(c => {
                if (totalDocenas === 0) return 660 / cargas.length;
                return (c.hechas / totalDocenas) * 660; // 660 mins = 11 Horas
            });

            let relojActualMins = 0; // 0 = 07:00 AM

            cargas.forEach((c, idx) => {
                let minsPuros = minutosTrabajoPuro[idx];
                let inicioCargaMins = relojActualMins;
                let parosEncontrados = [];
                let acumuladoParosCarga = 0;

                RECESOS_FIJOS.forEach(r => {
                    let finEstimado = inicioCargaMins + minsPuros + acumuladoParosCarga;
                    if (inicioCargaMins < r.finMin && finEstimado > r.inicioMin) {
                        parosEncontrados.push(r);
                        acumuladoParosCarga += r.duracion;
                    }
                });

                let duracionTotalBloque = minsPuros + acumuladoParosCarga;
                let finCargaMins = inicioCargaMins + duracionTotalBloque;
                relojActualMins = finCargaMins;

                container.innerHTML += `
                    <div class="carga-row">
                        <div class="name">CARGA ${idx + 1}</div>
                        <div class="time">
                            ${formatoHora(inicioCargaMins)} - ${formatoHora(finCargaMins)}
                            <span class="dur">${formatoDuracion(duracionTotalBloque)}</span>
                        </div>
                    </div>
                `;

                parosEncontrados.forEach(rf => {
                    container.innerHTML += `
                        <div class="paro-row">
                            <div>↳ ${rf.nombre}</div>
                            <div class="time-tag">${rf.tag}</div>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
