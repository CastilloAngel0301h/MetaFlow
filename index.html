<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Flow - PWA</title>
    <style>
        :root {
            --bg-dark: #050508;
            --panel-bg: rgba(10, 12, 20, 0.85);
            --neon-cyan: #00f3ff;
            --neon-magenta: #d946ef;
            --neon-green: #39ff14;
            --neon-yellow: #ffea00;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(5, 5, 8, 0.9), rgba(5, 5, 8, 0.9)), url('https://images.unsplash.com/photo-1614729939124-032d0b56c9ce?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease-out;
        }

        .shenron-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.pinimg.com/originals/a0/0b/cc/a00bcce9d7240c1eebfbe4d693beaa1c.gif') center/cover;
            opacity: 0.4; pointer-events: none;
        }

        .dragon-balls-container {
            display: flex; gap: 15px; margin-bottom: 40px; z-index: 2;
        }

        .dragon-ball {
            width: 40px; height: 40px;
            background: radial-gradient(circle at 30% 30%, #ffaa00, #ff4500);
            border-radius: 50%;
            box-shadow: 0 0 15px #ff4500, inset 0 0 10px rgba(255,255,255,0.5);
            animation: bounce 1.5s infinite alternate;
        }
        .dragon-ball:nth-child(2) { animation-delay: 0.2s; }
        .dragon-ball:nth-child(3) { animation-delay: 0.4s; }
        .dragon-ball:nth-child(4) { animation-delay: 0.6s; }
        .dragon-ball:nth-child(5) { animation-delay: 0.8s; }
        .dragon-ball:nth-child(6) { animation-delay: 1.0s; }
        .dragon-ball:nth-child(7) { animation-delay: 1.2s; }

        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); box-shadow: 0 20px 25px #ff4500; } }

        .login-box {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            padding: 30px; border-radius: 15px; z-index: 2;
            text-align: center; width: 90%; max-width: 400px;
        }

        .login-box h1 { color: var(--neon-cyan); margin-bottom: 20px; text-transform: uppercase; font-size: 2rem; text-shadow: 0 0 10px var(--neon-cyan); }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            background: #111; border: 1px solid var(--neon-magenta);
            color: #fff; border-radius: 8px; font-size: 1.1rem; text-align: center;
            outline: none; transition: 0.3s;
        }
        .login-input:focus { box-shadow: 0 0 15px var(--neon-magenta); }
        
        .btn-neon {
            background: transparent; color: #fff; font-weight: bold;
            padding: 12px 30px; border: 2px solid var(--neon-cyan); border-radius: 8px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: 0.3s; width: 100%; font-size: 1.1rem;
        }
        .btn-neon:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }

        #app-main { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--neon-magenta); padding-bottom: 15px; margin-bottom: 20px;
        }
        .header-title { font-size: 1.8rem; font-weight: 900; color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
        .header-sub { font-size: 0.8rem; color: #aaa; text-transform: uppercase; }
        
        .carga-card {
            background: var(--panel-bg); border: 1px solid rgba(217, 70, 239, 0.3);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .input-group label { display: block; font-size: 0.75rem; color: var(--neon-cyan); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input {
            width: 100%; padding: 10px; background: #0a0b10; border: 1px solid #333;
            color: #fff; border-radius: 6px; font-size: 1.2rem; outline: none;
        }
        
        .paros-container {
            background: var(--panel-bg); border: 1px solid var(--neon-yellow);
            border-radius: 12px; padding: 15px; margin-bottom: 20px;
            display: flex; gap: 15px; align-items: center; flex-wrap: wrap;
        }
        .paros-container h4 { color: var(--neon-yellow); width: 100%; font-size: 0.9rem; text-transform: uppercase; }

        .btn-add { background: var(--neon-magenta); border: none; color: white; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0 0 10px rgba(217, 70, 239, 0.5); }

        .banner-eficiencia {
            background: linear-gradient(90deg, #00f3ff22, var(--neon-cyan), #00f3ff22);
            border: 2px solid var(--neon-cyan); border-radius: 15px;
            text-align: center; padding: 25px; margin: 20px 0;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        }
        .eficiencia-valor { font-size: 4rem; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.8); line-height: 1; }
        .eficiencia-label { font-size: 0.9rem; color: #000; font-weight: bold; text-transform: uppercase; margin-top: 5px; letter-spacing: 2px; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; color: #000; font-weight: bold; font-size: 0.9rem; text-align: center;
        }
        .stat-box { background: rgba(255,255,255,0.7); padding: 8px; border-radius: 6px; }

        .timeline-box {
            background: var(--panel-bg); border-radius: 12px; border: 1px solid #333;
            overflow: hidden; margin-bottom: 30px;
        }
        .time-row {
            display: flex; justify-content: space-between; padding: 15px 20px;
            border-bottom: 1px solid #222; font-size: 0.9rem;
        }
        .time-row.carga { color: #fff; border-left: 4px solid var(--neon-cyan); }
        .time-row.receso { color: var(--neon-yellow); background: rgba(255, 234, 0, 0.05); border-left: 4px solid var(--neon-yellow); }
        .time-row .hora { font-weight: bold; color: var(--neon-cyan); font-size: 1.1rem; }
        .time-row.receso .hora { color: var(--neon-green); }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="shenron-bg"></div>
        <div class="dragon-balls-container">
            <div class="dragon-ball"></div><div class="dragon-ball"></div><div class="dragon-ball"></div>
            <div class="dragon-ball"></div><div class="dragon-ball"></div><div class="dragon-ball"></div><div class="dragon-ball"></div>
        </div>
        <div class="login-box">
            <h1>META FLOW</h1>
            <p style="color: #aaa; margin-bottom: 20px; font-size: 0.8rem;">SISTEMA DE EFICIENCIA</p>
            <input type="password" id="pin" class="login-input" placeholder="INGRESA TU PIN" autocomplete="off">
            <button class="btn-neon" onclick="verificarAcceso()">Verificar Ki</button>
            <p id="error-msg" style="color: #ff4500; margin-top: 15px; font-size: 0.9rem; display: none;"></p>
        </div>
    </div>

    <div id="app-main">
        <div class="header-bar">
            <div>
                <div class="header-title">META FLOW</div>
                <div class="header-sub">Gestión de Turno (07:00 AM - 07:00 PM)</div>
            </div>
            <div style="text-align: right;">
                <div style="color: var(--neon-magenta); font-weight: bold; font-size: 1.2rem;" id="nombre-usuario">Usuario</div>
                <div class="header-sub">🟢 Conectado</div>
            </div>
        </div>

        <!-- SECCIÓN DE TIEMPOS DE PAROS (OFF) -->
        <div class="paros-container">
            <h4>⏱️ Tiempos de Paros / Muertos (OFF)</h4>
            <div class="input-group" style="flex: 1; min-width: 120px;">
                <label>Horas Paro</label>
                <input type="number" id="paro-horas" value="0" min="0" oninput="calcularTodo()">
            </div>
            <div class="input-group" style="flex: 1; min-width: 120px;">
                <label>Minutos Paro</label>
                <input type="number" id="paro-minutos" value="0" min="0" max="59" oninput="calcularTodo()">
            </div>
        </div>

        <div id="contenedor-cargas"></div>
        
        <button class="btn-add" onclick="agregarCarga()">+ AÑADIR NUEVA CARGA</button>

        <div class="banner-eficiencia">
            <div class="eficiencia-valor" id="efi-final">0.00%</div>
            <div class="eficiencia-label">Eficiencia Final</div>
            <div class="stats-grid">
                <div class="stat-box">META ON: <span id="meta-on">0</span></div>
                <div class="stat-box">DOCENAS OFF: <span id="docenas-off">0</span></div>
                <div class="stat-box">META FINAL: <span id="meta-final">0</span></div>
                <div class="stat-box">HECHAS: <span id="hechas-total">0</span></div>
            </div>
        </div>

        <h3 style="color: var(--neon-cyan); margin-bottom: 15px; text-transform: uppercase;">Reporte Cuadre de Turno (07:00 AM - 07:00 PM)</h3>
        <div class="timeline-box" id="timeline-container"></div>
    </div>

    <script>
        let cargas = [{ id: 1, meta: 550, hechas: 0 }];
        const HORAS_TRABAJABLES = 11;
        const TOTAL_MINUTOS_TURNO = 660; // 11 horas de trabajo neto
        
        const RECESOS = [
            { id: 'r1', nombre: 'Receso 8:10 AM - 8:25 AM', min_inicio: 70, min_fin: 85, duracion: 15 },
            { id: 'r2', nombre: 'Almuerzo 11:20 AM - 11:50 AM', min_inicio: 260, min_fin: 290, duracion: 30 },
            { id: 'r3', nombre: 'Receso 3:10 PM - 3:25 PM', min_inicio: 490, min_fin: 505, duracion: 15 }
        ];

        const usuariosAutorizados = [
            { pin: "2004", nombre: "Angel Castillo 🚢" },
            { pin: "5863", nombre: "Kevin Ramón Pineda ⚔️" },
            { pin: "8198", nombre: "Carlos David Garcia 🦅" },
            { pin: "1734", nombre: "Libny Castillo ⚡" },
            { pin: "4321", nombre: "Derick Alexander Carvajal 🔥" },
            { pin: "3455", nombre: "Josué Rivera 🌀" },
            { pin: "1301", nombre: "Olvin Ramírez 🧠" },
            { pin: "2064", nombre: "Arnoldo Alvarenga 🤠" },
            { pin: "2711", nombre: "Yervi Mejia 🐯" },
            { pin: "3855", nombre: "Yeison Murillo 💀" },
            { pin: "5037", nombre: "Kevin Díaz 🍃" },
            { pin: "4005", nombre: "Erik Rosales ❄️" },
            { pin: "1507", nombre: "Fernando Sanchez 🦾" },
            { pin: "3307", nombre: "Edwin Alvarado 👑" },
            { pin: "3310", nombre: "Angel Flores 🏹" },
            { pin: "1800", nombre: "Usuario Invitado 🗺️" }
        ];

        async function verificarAcceso() {
            const pinIngresado = document.getElementById('pin').value;
            const usuario = usuariosAutorizados.find(u => u.pin === pinIngresado);
            if (usuario) {
                document.getElementById('nombre-usuario').innerText = "Tripulante: " + usuario.nombre;
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('app-main').style.display = 'block';
                    renderizarCargas();
                }, 800);
            } else {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.innerText = "PIN incorrecto. Nivel de Ki insuficiente.";
                errorMsg.style.display = 'block';
            }
        }

        function agregarCarga() {
            cargas.push({ id: cargas.length + 1, meta: 0, hechas: 0 });
            renderizarCargas();
        }

        function actualizarValor(index, campo, valor) {
            cargas[index][campo] = parseFloat(valor) || 0;
            calcularTodo();
        }

        function renderizarCargas() {
            const container = document.getElementById('contenedor-cargas');
            container.innerHTML = '';
            
            cargas.forEach((c, index) => {
                container.innerHTML += `
                    <div class="carga-card">
                        <div class="input-group">
                            <label>Carga ${c.id}</label>
                            <input type="text" value="CARGA #${c.id}" disabled style="color: var(--neon-magenta); font-weight: bold;">
                        </div>
                        <div class="input-group">
                            <label>Meta Docenas</label>
                            <input type="number" value="${c.meta}" oninput="actualizarValor(${index}, 'meta', this.value)">
                        </div>
                        <div class="input-group">
                            <label>Docenas Hechas</label>
                            <input type="number" value="${c.hechas}" oninput="actualizarValor(${index}, 'hechas', this.value)" style="color: var(--neon-cyan); border-color: var(--neon-cyan);">
                        </div>
                    </div>
                `;
            });
            calcularTodo();
        }

        function formatoHora(minutosTotales) {
            let h = Math.floor(minutosTotales / 60) + 7; 
            let ampm = h >= 12 ? 'PM' : 'AM';
            if (h > 12) h -= 12;
            let m = Math.floor(minutosTotales % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${ampm}`;
        }

        function calcularTodo() {
            let sumaMetas = cargas.reduce((sum, c) => sum + c.meta, 0);
            let cantidadCargas = cargas.length > 0 ? cargas.length : 1;
            
            // 1. Meta ON = Suma de las metas de cada carga / cantidad de cargas
            let metaOn = sumaMetas / cantidadCargas;

            // 2. Cálculo de Paros (OFF) en horas decimales
            let pHoras = parseFloat(document.getElementById('paro-horas').value) || 0;
            let pMinutos = parseFloat(document.getElementById('paro-minutos').value) || 0;
            let tiempoMuertoHoras = pHoras + (pMinutos / 60);

            // Docenas Off = (Meta ON / 11 horas) * Tiempo Muerto
            let tasaPorHora = metaOn / HORAS_TRABAJABLES;
            let docenasOff = tasaPorHora * tiempoMuertoHoras;

            // 3. Meta Final = Meta ON - Docenas Off
            let metaFinal = metaOn - docenasOff;
            if (metaFinal < 0) metaFinal = 0;

            // 4. Eficiencia Final = Cantidad de docenas hechas / Meta Final
            let hechasTotal = cargas.reduce((sum, c) => sum + c.hechas, 0);
            let eficienciaFinal = metaFinal > 0 ? (hechasTotal / metaFinal) * 100 : 0;

            // Actualizar interfaz visual
            document.getElementById('efi-final').innerText = eficienciaFinal.toFixed(2) + '%';
            document.getElementById('meta-on').innerText = metaOn.toFixed(1);
            document.getElementById('docenas-off').innerText = docenasOff.toFixed(1);
            document.getElementById('meta-final').innerText = metaFinal.toFixed(1);
            document.getElementById('hechas-total').innerText = hechasTotal;

            generarCuadre(eficienciaFinal);
        }

        function generarCuadre(eficiencia) {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            let efCalc = eficiencia > 0 ? eficiencia : 100; 
            let tiempoAcumulado = 0; 
            let metaTotalCargas = cargas.reduce((sum, c) => sum + c.meta, 0);

            let html = '';
            let recesoIndex = 0;

            cargas.forEach((c) => {
                if(metaTotalCargas === 0) return;
                
                // Distribución proporcional del tiempo adaptada a la eficiencia para cuadrar a 12 horas (660 min)
                let proporcion = c.meta / metaTotalCargas;
                let minRequeridos = (TOTAL_MINUTOS_TURNO * proporcion) / (efCalc / 100);
                
                let minInicioCarga = tiempoAcumulado;
                let minFinCarga = tiempoAcumulado + minRequeridos;

                while (recesoIndex < RECESOS.length && minFinCarga > RECESOS[recesoIndex].min_inicio) {
                    let r = RECESOS[recesoIndex];
                    
                    html += `
                        <div class="time-row carga">
                            <div>CARGA ${c.id}</div>
                            <div class="hora">${formatoHora(minInicioCarga)} - ${formatoHora(r.min_inicio)}</div>
                        </div>
                    `;
                    
                    html += `
                        <div class="time-row receso">
                            <div>↳ PARO FIJO: ${r.nombre}</div>
                            <div class="hora">${r.duracion} min</div>
                        </div>
                    `;
                    
                    minFinCarga += r.duracion;
                    minInicioCarga = r.min_fin;
                    tiempoAcumulado = r.min_fin;
                    recesoIndex++;
                }

                if (minInicioCarga < minFinCarga) {
                    html += `
                        <div class="time-row carga">
                            <div>CARGA ${c.id}</div>
                            <div class="hora">${formatoHora(minInicioCarga)} - ${formatoHora(minFinCarga)}</div>
                        </div>
                    `;
                }
                
                tiempoAcumulado = minFinCarga;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
